services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teja
      POSTGRES_PASSWORD: teja_pass
      POSTGRES_DB: doc_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teja -d doc_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama (local LLM — replaces HuggingFace/OpenAI) ────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  # ── FastAPI backend ─────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      # Override to point at the ollama service hostname (not localhost)
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      # Hot-reload: local code changes reflect in the container
      - ./backend:/app
      # Persist ChromaDB vectors across container restarts
      - chroma_data:/app/chroma_db
      # Shared temp storage for uploaded PDFs
      - tmp_uploads:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # ── React frontend (Vite dev server) ────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's installed node_modules, don't overwrite with host's
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
  tmp_uploads:
  ollama_data:
